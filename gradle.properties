# Project-wide Gradle settings (JDK 17; see docs/setup.md).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only option for Jetpack XR.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Wire the Fake* implementations instead of the real camera/XR/ExecuTorch modules
# (AppGraph.kt reads BuildConfig.USE_FAKES). Override per build: ./gradlew installDebug -PuseFakes=true
useFakes=false
