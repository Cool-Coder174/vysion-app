# Every pin here has a source URL and a verification record in docs/stack.md §1.
# Change a version only together with that table.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"          # fallback "2.2.10" (AGP 9.4.1's bundled KGP) if the compose-plugin lift misbehaves (stack.md D10)
compileSdk = "37"
minSdk = "34"              # Galaxy XR ships Android 14 / API 34 (stack.md D3)
targetSdk = "36"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
coroutines = "1.11.0"
camerax = "1.6.2"          # 1.7.0-alpha03 deprecates Camera2CameraInfo; do not bump during the hackathon
xrCompose = "1.0.0-beta01"
xrScenecore = "1.0.0-rc02"
xrArcore = "1.0.0-rc02"    # SRS said 1.0.0-alpha15; four releases stale on 2026-10-17 (stack.md §1)
xrRuntime = "1.0.0-rc02"   # stack.md D2: what scenecore/arcore rc02 pin
executorch = "1.4.0"       # stack.md D1 (bumped 2026-10-17: PP-OCRv6 and LFM2.5-VL files are 1.4.x; 1.3.1 exports still load, one minor back)
junit4 = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-xr-compose = { group = "androidx.xr.compose", name = "compose", version.ref = "xrCompose" }
androidx-xr-scenecore = { group = "androidx.xr.scenecore", name = "scenecore", version.ref = "xrScenecore" }
androidx-xr-arcore = { group = "androidx.xr.arcore", name = "arcore", version.ref = "xrArcore" }
androidx-xr-runtime = { group = "androidx.xr.runtime", name = "runtime", version.ref = "xrRuntime" }
executorch-android = { group = "org.pytorch", name = "executorch-android", version.ref = "executorch" }
executorch-android-vulkan = { group = "org.pytorch", name = "executorch-android-vulkan", version.ref = "executorch" }   # -Pexecutorch=vulkan only (docs/benchmarks.md "Adreno GPU")
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
